# ===============================
# App Configuration
# ===============================
spring.application.name=${SPRING_APPLICATION_NAME}

# ===============================
# Keycloak Configuration
# ===============================
keycloak.realm=${KEYCLOAK_REALM}
keycloak.client_id=${KEYCLOAK_CLIENT_ID}
keycloak.client_secret=${KEYCLOAK_CLIENT_SECRET}
keycloak.server_url=${KEYCLOAK_SERVER_URL}

# ===============================
# AI Service (Google Gemini)
# ===============================
spring.ai.openai.chat.base-url=${SPRING_AI_OPENAI_CHAT_BASE_URL}
spring.ai.openai.chat.completions-path=${SPRING_AI_OPENAI_CHAT_COMPLETIONS_PATH}
spring.ai.openai.api-key=${SPRING_AI_OPENAI_API_KEY}
spring.ai.openai.chat.options.model=${SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL}

# ===============================
# Database Configuration
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME}

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL}
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL}

# ===============================
# Security
# ===============================
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI}
